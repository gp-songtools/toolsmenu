<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GP Song Tools</title>
  <meta name="description" content="One place to open every tool in the gp-songtools collection.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
  <link rel="stylesheet" href="css/gp.css">
  <style>
    /* Menu page. Tokens and buttons come from css/gp.css (design-system/gp-song-tools/MASTER.md). */
    main { max-width: 1120px; margin: 0 auto; padding: var(--s-8) var(--s-4) var(--s-8); }

    header { margin-bottom: var(--s-6); }
    h1 { font-size: var(--text-4xl); line-height: 1; font-weight: 700; letter-spacing: -.035em; margin: 0 0 var(--s-4); }
    header p { margin: 0; max-width: 62ch; color: var(--muted); font-size: var(--text-lg); }
    header p a { font-weight: 700; }

    /* Signature: a spectrum in the tool colours, drawn once on load */
    .spectrum { display: flex; align-items: flex-end; gap: 3px; height: 72px; margin: var(--s-5) 0 var(--s-4); }
    .spectrum i {
      flex: 1; min-width: 2px; border-radius: 2px 2px 0 0; background: var(--c);
      height: var(--h); transform-origin: bottom;
      animation: rise 700ms var(--ease-out) both; animation-delay: var(--d);
    }
    @keyframes rise { from { transform: scaleY(.04); } to { transform: scaleY(1); } }

    .search {
      width: 100%; max-width: 380px; min-height: 44px; padding: 0 var(--s-4);
      font: 400 var(--text-md) var(--font-body); color: var(--text);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md);
    }
    .search::placeholder { color: var(--muted); }
    .search:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

    /* Tool lanes, like tracks in an arrangement */
    .grid { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--s-3); }
    .card {
      --c: var(--gen);
      display: grid;
      /* name over description, so the text has the full middle column */
      grid-template-columns: 56px minmax(0, 1fr) auto;
      grid-template-areas: "icon title actions" "icon desc actions";
      gap: var(--s-1) var(--s-5);
      align-items: center;
      padding: var(--s-4) var(--s-5) var(--s-4) var(--s-4);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--c);
      border-radius: var(--r-lg);
      transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }
    .card:hover { background: var(--surface-2); border-color: var(--c); }
    .card[data-repo="lyricpad"] { --c: var(--lp); }
    .card[data-repo="gp-blueprint"] { --c: var(--bp); }
    .card[data-repo="ideawizard"] { --c: var(--iw); }
    .card[data-repo="gp-randomash"] { --c: var(--rm); }
    .card[data-repo="earprint"] { --c: var(--ep); }
    .card[data-repo="gp-master"] { --c: var(--gm); }
    .card[data-repo="auralyrics-studio"] { --c: var(--al); }
    .card[data-repo="toolsmenu"] { --c: var(--ss); }
    .icon {
      display: grid; place-items: center; width: 56px; height: 56px;
      border-radius: var(--r-md); font-size: 1.625rem; line-height: 1;
      background: color-mix(in srgb, var(--c) 16%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    }
    .card .icon { grid-area: icon; align-self: start; }
    .card h2 { grid-area: title; align-self: end; margin: 0; font-size: var(--text-xl); line-height: 1.15; font-weight: 700; letter-spacing: -.015em; }
    .card p { grid-area: desc; align-self: start; margin: 0; color: var(--muted); font-size: var(--text-sm); line-height: 1.55; max-width: 64ch; text-wrap: pretty; }
    .actions { grid-area: actions; display: flex; gap: var(--s-2); align-items: center; justify-content: flex-end; }
    .card .btn.primary { background: var(--c); color: var(--on-tool); }
    .card .btn.primary:hover { background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 35%, transparent); }
    .card .btn.ghost { border-color: transparent; color: var(--muted); padding: 0 var(--s-3); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--muted) 45%, transparent); text-underline-offset: 4px; }
    .card .btn.ghost:hover { color: var(--text); background: color-mix(in srgb, var(--c) 12%, transparent); text-decoration-color: currentColor; }

    .empty { color: var(--muted); display: none; padding: var(--s-5) 0; }
    footer { margin-top: var(--s-7); padding-top: var(--s-5); border-top: 1px solid var(--border); color: var(--muted); font-size: var(--text-xs); }
    footer a { color: var(--text); display: inline-block; padding-block: 12px; margin-block: -12px; } /* 44px hit area, same look */

    @media (max-width: 900px) {
      .card { grid-template-columns: 56px minmax(0, 1fr); grid-template-areas: "icon title" "icon desc" "icon actions"; }
      .actions { justify-content: flex-start; margin-top: var(--s-2); }
    }
    @media (max-width: 560px) {
      main { padding-top: var(--s-6); }
      .spectrum { height: 52px; gap: 2px; }
      .card { grid-template-columns: 48px minmax(0, 1fr); grid-template-areas: "icon title" "desc desc" "actions actions"; gap: var(--s-2) var(--s-4); padding: var(--s-4); }
      .icon { width: 48px; height: 48px; font-size: 1.375rem; }
      .card h2 { align-self: center; }
      .actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🎛️ GP Song Tools</h1>
      <p>Every songwriting and production tool in one place. <a href="about.html">See how they work together →</a></p>
      <div class="spectrum" id="spectrum" aria-hidden="true"></div>
      <input class="search" type="search" placeholder="Filter tools…" aria-label="Filter tools" id="search">
    </header>

    <ul class="grid" id="tools"></ul>
    <p class="empty" id="empty">No tools match that filter.</p>

    <footer>
      Source for every tool lives in the
      <a href="https://github.com/gp-songtools">gp-songtools GitHub organization</a>.
      · <a href="about.html">About</a>
      · <a href="privacy.html">Privacy &amp; credits</a>
    </footer>
  </main>

  <script>
    // To add a tool, add an entry here. `url` is the live app, `repo` the GitHub repo name,
    // `changelog` the tool's changelog.
    const ORG = "gp-songtools";
    const TOOLS = [
      {
        name: "Lyricpad",
        repo: "lyricpad",
        icon: "✍️",
        description: "Write lyrics with live syllable counts, a rhyme finder (perfect, near and vowel rhymes) and a thesaurus. Songs save to your Google Drive.",
        url: "https://gp-songtools.github.io/lyricpad/",
        changelog: "https://gp-songtools.github.io/lyricpad/changelog.html"
      },
      {
        name: "GP Blueprint",
        repo: "gp-blueprint",
        icon: "🎨",
        description: "Turn an artist, song or topic into Suno-ready style tags, song structure, rhyme scheme and lyrics, grounded in real audio analysis.",
        url: "https://gp-songtools.github.io/gp-blueprint/",
        changelog: "https://gp-songtools.github.io/gp-blueprint/changelog.html"
      },
      {
        name: "Idea Wizard",
        repo: "ideawizard",
        icon: "🧙",
        description: "Get three song ideas that fit your sound from GP Blueprint's style and structure and Earprint's analysis, then expand one down to line-by-line directions.",
        url: "https://gp-songtools.github.io/ideawizard/",
        changelog: "https://gp-songtools.github.io/ideawizard/changelog.html"
      },
      {
        name: "Randomash",
        repo: "gp-randomash",
        icon: "🎲",
        description: "Blend genres from 138 choices into a Lyria 3 prompt and generate clips or full songs, with vocals, stems and a dry run that costs nothing.",
        url: "https://gp-songtools.github.io/gp-randomash/",
        changelog: "https://gp-songtools.github.io/gp-randomash/changelog.html"
      },
      {
        name: "Earprint",
        repo: "earprint",
        icon: "👂",
        description: "Measure a track's tempo, key, loudness and mood in your browser, then get an AI review with edits you can send to GP Mastering.",
        url: "https://gp-songtools.github.io/earprint/",
        changelog: "https://gp-songtools.github.io/earprint/changelog.html"
      },
      {
        name: "GP Mastering",
        repo: "gp-master",
        icon: "🎚️",
        description: "Master songs in your browser: tone correction, compression and limiting to a loudness target, matched to reference tracks, with stem separation.",
        url: "https://gp-songtools.github.io/gp-master/",
        changelog: "https://gp-songtools.github.io/gp-master/changelog.html"
      },
      {
        name: "AuraLyrics Studio",
        repo: "auralyrics-studio",
        icon: "🎬",
        description: "Turn a song into a lyric video: audio-reactive visuals, lyrics synced from an .lrc file or transcribed by Whisper, and MP4 or WebM export in your browser.",
        url: "https://gp-songtools.github.io/auralyrics-studio/",
        changelog: "https://gp-songtools.github.io/auralyrics-studio/changelog.html"
      },
      {
        name: "Spec to Suno",
        repo: "toolsmenu",
        icon: "🚀",
        description: "Send a song spec to your Suno account from Claude: download a Claude skill (one upload, then ask in any chat) or a page with sliders and a request preview.",
        url: "https://gp-songtools.github.io/toolsmenu/songspec/spec-to-suno/",
        changelog: "https://github.com/gp-songtools/toolsmenu/commits/main/songspec/spec-to-suno"
      }
    ];

    const list = document.getElementById("tools");
    const empty = document.getElementById("empty");

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      const shown = TOOLS.filter(t =>
        !q || (t.name + " " + t.description).toLowerCase().includes(q));
      list.innerHTML = "";
      for (const t of shown) {
        const li = document.createElement("li");
        li.className = "card";
        li.dataset.repo = t.repo;
        li.innerHTML = `
          <div class="icon" aria-hidden="true"></div>
          <h2></h2>
          <p></p>
          <div class="actions">
            <a class="btn primary" target="_blank" rel="noopener">Open</a>
            <a class="btn ghost" target="_blank" rel="noopener">Source</a>
            <a class="btn ghost" target="_blank" rel="noopener">Changelog</a>
          </div>`;
        li.querySelector(".icon").textContent = t.icon;
        li.querySelector("h2").textContent = t.name;
        li.querySelector("p").textContent = t.description;
        const [open, src, log] = li.querySelectorAll("a");
        open.href = t.url;
        open.setAttribute("aria-label", `Open ${t.name}`);
        src.href = `https://github.com/${ORG}/${t.repo}`;
        src.setAttribute("aria-label", `${t.name} source on GitHub`);
        log.href = t.changelog;
        log.setAttribute("aria-label", `${t.name} changelog`);
        list.appendChild(li);
      }
      empty.style.display = shown.length ? "none" : "block";
    }

    // Decorative spectrum in the tool colours (one band per tool, fixed shape, drawn once).
    (function spectrum() {
      const el = document.getElementById("spectrum");
      const vars = { lyricpad: "lp", "gp-blueprint": "bp", ideawizard: "iw", "gp-randomash": "rm", earprint: "ep", "gp-master": "gm", "auralyrics-studio": "al", toolsmenu: "ss" };
      const per = 7, n = TOOLS.length * per;
      for (let i = 0; i < n; i++) {
        const x = i / n;
        const h = 18 + 70 * Math.abs(Math.sin(x * 9.2) * 0.6 + Math.sin(x * 23.7 + 1.3) * 0.4) * (1 - 0.45 * x);
        const bar = document.createElement("i");
        bar.style.setProperty("--c", `var(--${vars[TOOLS[Math.floor(i / per)].repo] || "gen"})`);
        bar.style.setProperty("--h", Math.min(100, h).toFixed(1) + "%");
        bar.style.setProperty("--d", (i * 9) + "ms");
        el.appendChild(bar);
      }
    })();

    document.getElementById("search").addEventListener("input", e => render(e.target.value));
    render();
  </script>

</body>
</html>

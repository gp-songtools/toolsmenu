<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GP Song Tools</title>
  <meta name="description" content="One place to open every tool in the gp-songtools collection.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
  <style>
    @font-face {
      font-family: "Archivo";
      src: url("fonts/archivo-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-stretch: 62% 125%;
      font-display: swap;
    }
    :root {
      --bg: #e3e6ea;          /* faceplate */
      --surface: #f6f7f8;     /* panel */
      --border: #c9ced6;
      --bevel: #ffffff;
      --text: #161b26;        /* engraving */
      --muted: #596171;       /* legend */
      --accent: #f2a900;      /* signal amber */
      --accent-text: #161b26;
      --accent-line: #a87400; /* amber dark enough for lines and text on the faceplate */
      --accent-hover: #ffbb1a;
      --focus: #a87400;
      --press: rgba(22,27,38,.22);
      --shade: rgba(22,27,38,.25);
      --c: var(--muted);
      --bp: #7c3aed; --lp: #b4532a; --iw: #2563eb; --rm: #b45309;
      --ep: #d83a72; --gm: #00796b; --al: #db2777; --ss: #161b26;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151c28;
        --surface: #1e2737;
        --border: #2f3a4e;
        --bevel: #263043;
        --text: #eef1f5;
        --muted: #9aa4b5;
        --accent: #f2a900;
        --accent-text: #161b26;
        --accent-line: #f2b733;
        --focus: #f2a900;
        --bp: #a78bfa; --lp: #e08a5f; --iw: #60a5fa; --rm: #fbbf24;
        --ep: #ff6b9c; --gm: #3ccfbf; --al: #f472b6; --ss: #eef1f5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.5 "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-stretch: 100%;
    }
    a { color: inherit; text-decoration-color: var(--accent-line); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    a:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
    main { max-width: 1040px; margin: 0 auto; padding: 56px 16px 64px; }

    /* Header: the model name on the front of the rack */
    header { display: grid; grid-template-columns: 1fr auto; gap: 8px 32px; align-items: end; margin-bottom: 28px; }
    h1 {
      grid-column: 1 / -1;
      margin: 0;
      font-size: clamp(2.6rem, 9vw, 5.25rem);
      line-height: .92;
      font-weight: 850;
      font-stretch: 125%;
      letter-spacing: -.02em;
    }
    header p { margin: 0; max-width: 72ch; color: var(--muted); font-size: 1.0625rem; }
    header p a { color: var(--text); font-weight: 600; }
    .search {
      width: 280px;
      padding: 10px 14px;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: inset 0 1px 2px var(--shade);
    }
    .search::placeholder { color: var(--muted); }

    /* The rack: one 1U strip per tool */
    .grid {
      list-style: none;
      padding: 10px;
      margin: 0;
      display: grid;
      gap: 6px;
      background: var(--border);
      border-radius: 10px;
    }
    .card {
      --c: var(--muted);
      position: relative;
      display: grid;
      grid-template-columns: 56px minmax(150px, 220px) 1fr auto;
      gap: 4px 20px;
      align-items: center;
      background: var(--surface);
      border-radius: 4px;
      box-shadow: inset 0 1px 0 var(--bevel);
      padding: 14px 20px 14px 14px;
    }
    .card[data-repo="lyricpad"] { --c: var(--lp); }
    .card[data-repo="gp-blueprint"] { --c: var(--bp); }
    .card[data-repo="ideawizard"] { --c: var(--iw); }
    .card[data-repo="gp-randomash"] { --c: var(--rm); }
    .card[data-repo="earprint"] { --c: var(--ep); }
    .card[data-repo="gp-master"] { --c: var(--gm); }
    .card[data-repo="auralyrics-studio"] { --c: var(--al); }
    .card[data-repo="toolsmenu"] { --c: var(--ss); }
    /* Jack: a socket ringed in the tool's cable colour, the emoji is the device badge */
    .icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 4px solid var(--c);
      background: var(--bg);
      box-shadow: inset 0 0 0 3px var(--surface), inset 0 2px 6px var(--shade);
      font-size: 1.375rem;
      line-height: 1;
    }
    .card h2 {
      margin: 0;
      font-size: 1.3125rem;
      line-height: 1.15;
      font-weight: 750;
      font-stretch: 112%;
      letter-spacing: -.01em;
    }
    .card p { margin: 0; color: var(--muted); max-width: 62ch; font-size: .9375rem; line-height: 1.5; }
    .actions { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
    .btn {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 5px;
      font-weight: 600;
      font-size: .9375rem;
      font-stretch: 90%;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.primary {
      background: var(--accent);
      color: var(--accent-text);
      padding: 8px 18px;
      box-shadow: inset 0 -2px 0 var(--press);
    }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.primary:active { box-shadow: inset 0 2px 0 var(--press); }
    .btn.ghost { color: var(--muted); }
    .btn.ghost:hover { color: var(--text); text-decoration: underline; text-decoration-color: var(--c); }
    .empty { color: var(--muted); display: none; padding: 20px 4px; }
    footer { margin-top: 40px; color: var(--muted); font-size: .875rem; max-width: 70ch; }
    footer a { color: var(--text); }

    @media (max-width: 860px) {
      .card { grid-template-columns: 56px 1fr; padding: 16px; }
      .card p { grid-column: 2; }
      .actions { grid-column: 2; justify-content: flex-start; margin-top: 8px; margin-left: -12px; }
    }
    @media (max-width: 560px) {
      main { padding-top: 36px; }
      header { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .grid { padding: 6px; }
      .card { grid-template-columns: 44px 1fr; gap: 4px 14px; padding: 14px 12px; }
      .icon { width: 44px; height: 44px; border-width: 3px; font-size: 1.125rem; }
      .card p { grid-column: 1 / -1; }
      .actions { grid-column: 1 / -1; margin-left: 0; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🎛️ GP Song Tools</h1>
      <p>Every songwriting and production tool in one place. <a href="about.html">See how they work together →</a></p>
      <input class="search" type="search" placeholder="Filter tools…" aria-label="Filter tools" id="search">
    </header>

    <ul class="grid" id="tools"></ul>
    <p class="empty" id="empty">No tools match that filter.</p>

    <footer>
      Source for every tool lives in the
      <a href="https://github.com/gp-songtools">gp-songtools GitHub organization</a>.
      · <a href="about.html">About</a>
      · <a href="privacy.html">Privacy &amp; credits</a>
    </footer>
  </main>

  <script>
    // To add a tool, add an entry here. `url` is the live app, `repo` the GitHub repo name,
    // `changelog` the tool's changelog.
    const ORG = "gp-songtools";
    const TOOLS = [
      {
        name: "Lyricpad",
        repo: "lyricpad",
        icon: "✍️",
        description: "Write lyrics with live syllable counts, a rhyme finder (perfect, near and vowel rhymes) and a thesaurus. Songs save to your Google Drive.",
        url: "https://gp-songtools.github.io/lyricpad/",
        changelog: "https://gp-songtools.github.io/lyricpad/changelog.html"
      },
      {
        name: "GP Blueprint",
        repo: "gp-blueprint",
        icon: "🎨",
        description: "Turn an artist, song or topic into Suno-ready style tags, song structure, rhyme scheme and lyrics, grounded in real audio analysis.",
        url: "https://gp-songtools.github.io/gp-blueprint/",
        changelog: "https://gp-songtools.github.io/gp-blueprint/changelog.html"
      },
      {
        name: "Idea Wizard",
        repo: "ideawizard",
        icon: "🧙",
        description: "Get three song ideas that fit your sound from GP Blueprint's style and structure and Earprint's analysis, then expand one down to line-by-line directions.",
        url: "https://gp-songtools.github.io/ideawizard/",
        changelog: "https://gp-songtools.github.io/ideawizard/changelog.html"
      },
      {
        name: "Randomash",
        repo: "gp-randomash",
        icon: "🎲",
        description: "Blend genres from 138 choices into a Lyria 3 prompt and generate clips or full songs, with vocals, stems and a dry run that costs nothing.",
        url: "https://gp-songtools.github.io/gp-randomash/",
        changelog: "https://gp-songtools.github.io/gp-randomash/changelog.html"
      },
      {
        name: "Earprint",
        repo: "earprint",
        icon: "👂",
        description: "Measure a track's tempo, key, loudness and mood in your browser, then get an AI review with edits you can send to GP Mastering.",
        url: "https://gp-songtools.github.io/earprint/",
        changelog: "https://gp-songtools.github.io/earprint/changelog.html"
      },
      {
        name: "GP Mastering",
        repo: "gp-master",
        icon: "🎚️",
        description: "Master songs in your browser: tone correction, compression and limiting to a loudness target, matched to reference tracks, with stem separation.",
        url: "https://gp-songtools.github.io/gp-master/",
        changelog: "https://gp-songtools.github.io/gp-master/changelog.html"
      },
      {
        name: "AuraLyrics Studio",
        repo: "auralyrics-studio",
        icon: "🎬",
        description: "Turn a song into a lyric video: audio-reactive visuals, lyrics synced from an .lrc file or transcribed by Whisper, and MP4 or WebM export in your browser.",
        url: "https://gp-songtools.github.io/auralyrics-studio/",
        changelog: "https://gp-songtools.github.io/auralyrics-studio/changelog.html"
      },
      {
        name: "Spec to Suno",
        repo: "toolsmenu",
        icon: "🚀",
        description: "Send a song spec to your Suno account from Claude: download a Claude skill (one upload, then ask in any chat) or a page with sliders and a request preview.",
        url: "https://gp-songtools.github.io/toolsmenu/songspec/spec-to-suno/",
        changelog: "https://github.com/gp-songtools/toolsmenu/commits/main/songspec/spec-to-suno"
      }
    ];

    const list = document.getElementById("tools");
    const empty = document.getElementById("empty");

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      const shown = TOOLS.filter(t =>
        !q || (t.name + " " + t.description).toLowerCase().includes(q));
      list.innerHTML = "";
      for (const t of shown) {
        const li = document.createElement("li");
        li.className = "card";
        li.dataset.repo = t.repo;
        li.innerHTML = `
          <div class="icon" aria-hidden="true"></div>
          <h2></h2>
          <p></p>
          <div class="actions">
            <a class="btn primary" target="_blank" rel="noopener">Open</a>
            <a class="btn ghost" target="_blank" rel="noopener">Source</a>
            <a class="btn ghost" target="_blank" rel="noopener">Changelog</a>
          </div>`;
        li.querySelector(".icon").textContent = t.icon;
        li.querySelector("h2").textContent = t.name;
        li.querySelector("p").textContent = t.description;
        const [open, src, log] = li.querySelectorAll("a");
        open.href = t.url;
        open.setAttribute("aria-label", `Open ${t.name}`);
        src.href = `https://github.com/${ORG}/${t.repo}`;
        src.setAttribute("aria-label", `${t.name} source on GitHub`);
        log.href = t.changelog;
        log.setAttribute("aria-label", `${t.name} changelog`);
        list.appendChild(li);
      }
      empty.style.display = shown.length ? "none" : "block";
    }

    document.getElementById("search").addEventListener("input", e => render(e.target.value));
    render();
  </script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2c5b0c69f74b496998f02d0e1f651bd5"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
